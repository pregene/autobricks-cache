[package]
name = "autobricks-cache"
version = "0.1.102"
edition = "2021"
build = "build.rs"

[features]
default = []
benchmark = []

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
bytes = "1"
libloading = "0.8"
mysql = { version = "28", default-features = false, features = ["minimal-rust", "rustls-tls-ring"] }
openssl = { version = "0.10", features = ["vendored"] }
postgres = "0.19"
postgres-openssl = "0.5"
rusqlite = { version = "0.38", features = ["bundled-sqlcipher"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
overflow-checks = true
panic = "abort"
